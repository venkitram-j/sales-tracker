{% extends "base.html" %}
{% load django_tables2 %}
{% block title %}Branches - {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="mb-0">Branches</h4>
    <div class="d-flex gap-2">
        {% if perms.branches.add_branch %}
        <a href="{% url 'branches:upload' %}" class="btn btn-outline-primary"><i class="bi bi-file-earmark-arrow-up me-1"></i>Excel Upload</a>
        <a href="{% url 'branches:add' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add Branch</a>
        {% endif %}
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-white">
        <form method="get"
              hx-get="{{ request.path }}" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true"
              hx-trigger="keyup changed delay:400ms from:find input[name='q'], submit" data-no-disable="true">
            <input type="text" name="q" value="{{ search_query }}" class="form-control" placeholder="Search by name...">
        </form>
    </div>
    <div id="results" hx-boost="true" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">
        <div class="table-responsive">
            {% render_table table %}
        </div>
    </div>
</div>

{% include "partials/delete_modal.html" %}
{% endblock %}
