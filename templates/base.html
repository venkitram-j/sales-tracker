{% load static %}
<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}Django Project{% endblock %}</title>
	<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
	{% if request.user.is_authenticated %}
		<div class="dashboard-shell">
			{% include 'dashboard/sidebar.html' %}
			<div class="dashboard-content">
				<nav class="navbar dashboard-topbar" aria-label="Application header">
					<div class="container-fluid">
						<span class="dashboard-user-name ms-auto">{{ request.user.full_name|default:request.user.email }}</span>
					</div>
				</nav>
				<main class="dashboard-content-main">
	{% endif %}
	{% block content %}{% endblock %}
	{% if request.user.is_authenticated %}
				</main>
			</div>
		</div>
	{% endif %}
	<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
	<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
