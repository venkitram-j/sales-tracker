{% extends "base.html" %}
{% load django_tables2 %}
{% block title %}Branch-wise Sales Report - {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="mb-0">Branch-wise Sales Report</h4>
    <a href="{% url 'sales_data:list' %}" class="btn btn-outline-secondary"><i class="bi bi-list-ul me-1"></i>Raw Records</a>
</div>

<div class="card shadow-sm mb-3">
    <div class="card-body">
        {% include "partials/filter_form.html" %}
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-white">
        <h6 class="mb-0">Totals by Branch &amp; Product</h6>
    </div>
    <div id="results" hx-boost="true" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">
        <div class="table-responsive">
            {% render_table table %}
        </div>
    </div>
</div>
{% endblock %}
