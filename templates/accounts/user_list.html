{% extends "base.html" %}
{% load django_tables2 %}
{% block title %}Manage Users - {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="mb-0">Manage Users</h4>
    <div class="d-flex gap-2">
        {% if perms.auth.add_user %}
        <a href="{% url 'accounts:user_add' %}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Add New User</a>
        {% endif %}
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-white">
        {% include "partials/filter_form.html" %}
    </div>
    <div id="results" hx-boost="true" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">
        <div class="table-responsive">
            {% render_table table %}
        </div>
    </div>
</div>
{% endblock %}
