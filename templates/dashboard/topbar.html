<header class="navbar bg-body border-bottom sticky-top px-3 px-lg-4">
  <div class="container-fluid px-0">
    <button class="btn btn-outline-secondary d-lg-none me-2" data-bs-toggle="offcanvas"
      data-bs-target="#mobileSidebar" aria-label="Open navigation">
      <i class="bi bi-list"></i>
    </button>
    <div class="dropdown ms-auto">
      <button class="btn d-flex align-items-center gap-2 border-0 p-1 pe-2"
        data-bs-toggle="dropdown" aria-expanded="false">
        <span class="rounded-circle bg-primary text-white d-inline-flex
          align-items-center justify-content-center fw-semibold"
          style="width:40px;height:40px">
          {{ request.user.user_initials }}
        </span>
        <span class="d-none d-sm-block text-start">
          <span class="d-block small fw-semibold">
            {{ request.user.get_full_name }}
          </span>
          <span class="d-block small text-body-secondary">
            {{ user_role|default:'Administrator' }}
          </span>
        </span>
        <i class="bi bi-chevron-down small text-body-secondary"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li>
          <a class="dropdown-item" href="#">
            <i class="bi bi-person me-2"></i>Profile
          </a>
        </li>
        <li>
          <hr class="dropdown-divider">
        </li>
        <li>
          <form method="post" action="{% url 'accounts:logout' %}" data-loading-form>
            {% csrf_token %}
            <button class="dropdown-item text-danger" type="submit" data-loading-text="Signing out...">
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
