<div class="sidebar border border-right col-md-3 col-lg-2 p-0 bg-body-tertiary">
  <div class="offcanvas-md offcanvas-end bg-body-tertiary" tabindex="-1" id="sidebarMenu"
    aria-labelledby="sidebarMenuLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="sidebarMenuLabel">{{ APP_NAME }}</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu"
        aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-md-flex flex-column p-0 pt-lg-3 overflow-y-auto">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-2 active" href="{% url 'dashboard:home' %}"
            {% if request.resolver_match.namespace == 'dashboard' %}aria-current="page"{% endif %}>
            <i class="bi bi-grid-1x2"></i>
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-2" href="#"
            {% if request.resolver_match.namespace == 'accounts' %}aria-current="page"{% endif %}>
            <i class="bi bi-people"></i>
            Manage Users
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-2" href="#"
            {% if request.resolver_match.namespace == 'branches' %}aria-current="page"{% endif %}>
            <i class="bi bi-shop"></i>
            Branches
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-2" href="#"
            {% if request.resolver_match.namespace == 'products' %}aria-current="page"{% endif %}>
            <i class="bi bi-box-seam"></i>
            Products
          </a>
        </li>
      </ul>
      <hr class="my-3" />
      <ul class="nav flex-column mb-auto">
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-2" href="#">
            <i class="bi bi-person-circle"></i>
            My Profile
          </a>
        </li>
        <li class="nav-item">
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="nav-link d-flex align-items-center gap-2 border-0 bg-transparent w-100 text-start">
              <i class="bi bi-box-arrow-right"></i>
              Sign out
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</div>
