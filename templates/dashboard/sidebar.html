<aside id="mobileSidebar" class="app-sidebar offcanvas-lg offcanvas-start border-end bg-body" tabindex="-1"
  aria-labelledby="sidebarLabel">
  <div class="offcanvas-header border-bottom d-lg-none">
    <span id="sidebarLabel" class="fw-bold">{{ APP_NAME }}</span>
    <button class="btn-close"
      data-bs-target="#mobileSidebar" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column p-3 p-lg-4">
    <a href="{% url 'dashboard:home' %}" 
      class="d-flex align-items-center gap-2 text-decoration-none text-body mb-4">
      <span class="rounded-3 bg-primary text-white d-inline-flex align-items-center justify-content-center"
        style="width:40px;height:40px">
        <i class="bi bi-graph-up-arrow"></i>
      </span>
      <span class="fw-bold fs-5">{{ APP_NAME }}</span>
    </a>
    <div class="text-uppercase small fw-semibold text-body-secondary mb-2">Workspace</div>
    <nav class="nav flex-column gap-1">
      <a href="{% url 'dashboard:home' %}"
        class="nav-link rounded-3 text-body 
          {% if active_nav == '' %}active bg-primary-subtle text-primary{% endif %}">
        <i class="bi bi-speedometer2 me-2"></i>Dashboard
      </a>
      <a href="#"
        class="nav-link rounded-3 text-body
          {% if active_nav == 'users' %}active bg-primary-subtle text-primary{% endif %}">
        <i class="bi bi-people me-2"></i>Users
      </a>
      <a href="#"
        class="nav-link rounded-3 text-body
          {% if active_nav == 'stores' %}active bg-primary-subtle text-primary{% endif %}">
        <i class="bi bi-shop me-2"></i>Stores
      </a>
      <a href="#"
        class="nav-link rounded-3 text-body
          {% if active_nav == 'products' %}active bg-primary-subtle text-primary{% endif %}">
        <i class="bi bi-box-seam me-2"></i>Products
      </a>
    </nav>
  </div>
</aside>
