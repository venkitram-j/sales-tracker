{% extends "base.html" %}

{% block title %}Dashboard | {% endblock %}

{% block extra_css %}
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous"
	/>
	<style>
		.dashboard-page {
			min-height: 100vh;
			background: #f5f7fa;
		}

		.dashboard-navbar {
			background: #ffffff;
			border-bottom: 1px solid #e3e8ed;
		}

		.dashboard-brand {
			color: #1769aa;
			font-weight: 700;
			letter-spacing: 0;
		}

		.dashboard-brand:hover,
		.dashboard-brand:focus {
			color: #0f4f83;
		}

		.dashboard-heading {
			color: #17212b;
		}
	</style>
{% endblock %}

{% block content %}
	<div class="dashboard-page">
		<nav class="navbar navbar-expand-lg sticky-top dashboard-navbar" aria-label="Main navigation">
			<div class="container-fluid px-3 px-lg-4">
				<div class="dropdown">
					<button
						class="btn btn-light dropdown-toggle"
						type="button"
						data-bs-toggle="dropdown"
						aria-expanded="false"
					>
						{{ user.get_full_name|default:user.email }}
					</button>
					<ul class="dropdown-menu">
						<li>
							<form method="post" action="{% url 'accounts:logout' %}">
								{% csrf_token %}
								<button type="submit" class="dropdown-item">Log out</button>
							</form>
						</li>
					</ul>
				</div>

				<a class="navbar-brand dashboard-brand ms-auto" href="{% url 'dashboard:home' %}">
					Sales Tracker
				</a>
			</div>
		</nav>

		<main class="container py-5">
			<h1 class="dashboard-heading h2 mb-2">Dashboard</h1>
			<p class="text-secondary mb-0">Welcome back, {{ user.get_short_name|default:user.email }}.</p>
		</main>
	</div>
{% endblock %}

{% block extra_js %}
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"
	></script>
{% endblock %}
