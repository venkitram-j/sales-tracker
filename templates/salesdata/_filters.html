<form method="get" class="row g-2 align-items-end">
    <div class="col-md-2">
        <label class="form-label small mb-1">Branch</label>
        <select name="branch" class="form-select">
            <option value="">All Branches</option>
            {% for b in branches %}
            <option value="{{ b.pk }}" {% if selected_branch == b.pk|stringformat:"s" %}selected{% endif %}>{{ b.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label small mb-1">Product</label>
        <select name="product" class="form-select">
            <option value="">All Products</option>
            {% for p in products %}
            <option value="{{ p.pk }}" {% if selected_product == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label small mb-1">Department</label>
        <select name="department" class="form-select">
            <option value="">All Departments</option>
            {% for d in departments %}
            <option value="{{ d.pk }}" {% if selected_department == d.pk|stringformat:"s" %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label small mb-1">Admin</label>
        <select name="admin" class="form-select">
            <option value="">All Admins</option>
            {% for a in admins %}
            <option value="{{ a.pk }}" {% if selected_admin == a.pk|stringformat:"s" %}selected{% endif %}>{{ a.full_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label small mb-1">Buyer</label>
        <select name="buyer" class="form-select">
            <option value="">All Buyers</option>
            {% for buyer in buyers %}
            <option value="{{ buyer.pk }}" {% if selected_buyer == buyer.pk|stringformat:"s" %}selected{% endif %}>{{ buyer.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-1">
        <label class="form-label small mb-1">From</label>
        <input type="date" name="date_from" value="{{ date_from }}" class="form-control">
    </div>
    <div class="col-md-1">
        <label class="form-label small mb-1">To</label>
        <input type="date" name="date_to" value="{{ date_to }}" class="form-control">
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-funnel me-1"></i>Filter</button>
        <a href="." class="btn btn-outline-secondary btn-sm">Clear</a>
    </div>
</form>
